    <style>
        /* PARTNERS SECTION */

        #partners {
            width: 100%;
            min-height: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 100px;
            margin-bottom: 60px;
            box-sizing: border-box;

        }

        #partners-slide-container {
            width: 100%;
            max-width: 800px;
            margin: 60px auto 0;

            display: grid;
            grid-template-columns: 50px 1fr 50px;
            align-items: center;
            justify-items: center;
            gap: 30px;
        }

        .partner-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            gap: 20px;
        }

        .partner-image {
            width: 320px !important;
            height: 200px !important;
            object-fit: contain;
            border-radius: 0 !important;
            display: block;
        }

        .partner-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #444;
            margin: 0;
        }

        .partner-arrow {
            background: none;
            border: none;
            color: #555;
            font-size: 28px;
            cursor: pointer;
            padding: 15px;
            transition: color 0.3s ease;
        }

        .partner-arrow:hover {
            color: #00bf80;
        }

        /* MOBILE VERSION */

        @media (max-width: 600px) {

            #partners {
                min-height: 500px;
                padding: 40px 10px;
            }

            #partners-slide-container {
                grid-template-columns: 35px 1fr 35px;
                gap: 10px;
                margin-top: 40px;
            }

            .partner-image {
                width: 220px !important;
                height: 140px !important;
                object-fit: contain;
                border-radius: 0 !important;

            }

            .partner-name {
                font-size: 18px;
            }

            .partner-arrow {
                font-size: 22px;
            }
        }
    </style>

</head>

    <!-- PARTNERS SECTION -->

    <div class="section" id="partners">

        <div class="description">

            <h1>OUR PARTNERS</h1>

            <p>
                Meet the people and organizations who support our journey.
            </p>

        </div>


        <!-- PARTNER CAROUSEL -->

        <div id="partners-slide-container">

            <!-- PREVIOUS PARTNER -->

            <button class="partner-arrow" id="prev-partner" aria-label="Previous partner">

                <i class="fa-solid fa-chevron-left"></i>

            </button>


            <!-- PARTNER INFORMATION -->

            <div class="partner-slide">

                <img class="partner-image" src="" alt="Partner">

                <h3 class="partner-name"></h3>

            </div>


            <!-- NEXT PARTNER -->

            <button class="partner-arrow" id="next-partner" aria-label="Next partner">

                <i class="fa-solid fa-chevron-right"></i>

            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // PARTNERS LIST

        const partners = [

            {
                name: "FEP- Faculdade de Economia da Universidade do Porto",
                image: "images/team/photos/Partners/FEP.png"
            },

            {
                name: "IPDJ-Instituto Desporto Juventude",
                image: "images/team/photos/Partners/ipdj.png"
            },

            {
                name: "PwC",
                image: "images/team/photos/Partners/PwC.webp"
            }

        ];


        // CURRENT PARTNER

        let currentPartner = 0;


        // HTML ELEMENTS

        const partnerImage = document.querySelector(".partner-image");
        const partnerName = document.querySelector(".partner-name");

        const previousButton = document.getElementById("prev-partner");
        const nextButton = document.getElementById("next-partner");


        // DISPLAY PARTNER

        function showPartner(index) {

            const partner = partners[index];

            partnerImage.src = partner.image;
            partnerImage.alt = partner.name;

            partnerName.textContent = partner.name;

        }


        // PREVIOUS PARTNER

        previousButton.addEventListener("click", function () {

            currentPartner = (currentPartner - 1 + partners.length) % partners.length;

            showPartner(currentPartner);

        });


        // NEXT PARTNER

        nextButton.addEventListener("click", function () {

            currentPartner = (currentPartner + 1) % partners.length;

            showPartner(currentPartner);

        });


        // INITIALIZE CAROUSEL

        if (partners.length > 0) {

            showPartner(currentPartner);

        }

    </script>
